server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS: re-resolve service names, so a recreated container (new IP) keeps working
    resolver 127.0.0.11 valid=10s ipv6=off;

    # controller (northbound + southbound) and switch network APIs, same origin as the UI
    location /ctrl/ {
        set $ctrl http://controller:8181;
        rewrite ^/ctrl/(.*)$ /$1 break;
        proxy_pass $ctrl;
        proxy_read_timeout 120s;
    }
    location /net/ {
        set $net http://switch-network:9191;
        rewrite ^/net/(.*)$ /$1 break;
        proxy_pass $net;
    }

    location / { try_files $uri /index.html; }
}
