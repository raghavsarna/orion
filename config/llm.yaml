# Which LLM turns natural-language intents (Hindi / Hinglish / English) into intent JSON.
# This file is re-read on every translation, so edits apply without a restart.
#
# provider: anthropic          -> official Anthropic SDK (Claude)
#           openai-compatible  -> any API with POST {baseUrl}/chat/completions (e.g. a local model server)

provider: anthropic
model: claude-opus-5-5
baseUrl: ""                     # empty = provider default (required for openai-compatible)

# API key: put it in the environment variable named here (recommended), or in apiKey.
apiKeyEnv: ORION_LLM_API_KEY
apiKey: ""

maxTokens: 4096
timeoutSec: 60

# Anthropic only: if the model declines a request, let the API retry on a fallback model. Empty = off.
fallbacks: default

# System prompt template. {{context}} is replaced with the current links, host subnets and groups.
promptFile: /config/prompts/intent_prompt.txt
