# Orion demo topology: five switches in a ring, small enough to follow at a glance.
# The switch network reads this file at startup. Each switch tells the controller its part when it registers.
#
#              C ───── D
#             /         \
#   10.0.1.x A           B 10.0.2.x
#             \         /
#              └── E ──┘
#
# From A to B there is a short route (A → E → B, 2 hops) and a long one (A → C → D → B, 3 hops).
# D has a free port 3, used when the demo adds a new switch F.
#
# Other topologies:  ORION_TOPOLOGY=topology-fabric.yaml   (Figure 1 of the paper, 8 switches)
#                    ORION_TOPOLOGY=topology-triangle.yaml (3 switches, used by the end-to-end test)
#
#   switches: id, name, number of ports, and host subnets attached to ports
#   links:    a wire between two switch ports ("switchId:port"), with its travel time in ms

controller:
  url: http://localhost:8181        # overridden by the CONTROLLER_URL env var (docker-compose sets it)
  authToken: orion-secret-token

switches:
  - id: A
    name: edge
    ports: 3
    hosts:
      - { port: 3, subnet: 10.0.1.0/24 }
  - id: B
    name: edge
    ports: 3
    hosts:
      - { port: 3, subnet: 10.0.2.0/24 }
  - { id: C, name: upper, ports: 2 }
  - { id: D, name: upper, ports: 3 }
  - { id: E, name: lower, ports: 2 }

links:
  - { id: AC, a: "A:1", b: "C:1", latencyMs: 5 }
  - { id: CD, a: "C:2", b: "D:1", latencyMs: 5 }
  - { id: DB, a: "D:2", b: "B:1", latencyMs: 5 }
  - { id: AE, a: "A:2", b: "E:1", latencyMs: 5 }
  - { id: EB, a: "E:2", b: "B:2", latencyMs: 5 }
