name: orion

# Start the whole system:   docker compose up --build
# Open the UI:              http://localhost:3000
# Stop it:                  docker compose down
#
# Host ports can be changed with env vars, e.g.  UI_PORT=3100 docker compose up --build
# To use Hindi/natural-language intents, set ORION_LLM_API_KEY (see config/llm.yaml) before starting.

x-common-env: &common-env
  ORION_TIMEZONE: ${ORION_TIMEZONE:-Asia/Kolkata}

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orion
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: orion
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - orion-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orion -d orion"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  sdn-controller:
    build:
      context: ./backend
      args:
        MODULE: sdn-controller
    environment:
      <<: *common-env
      CONTROLLER_PORT: 8181
      FAIL_STATIC_THRESHOLD: ${FAIL_STATIC_THRESHOLD:-0.4}
      DB_URL: jdbc:postgresql://postgres:5432/orion
      DB_USER: orion
      DB_PASSWORD: orion
      ORION_AUTH_TOKEN: orion-secret-token
      LLM_CONFIG: /config/llm.yaml
      ORION_LLM_API_KEY: ${ORION_LLM_API_KEY:-}
    volumes:
      - ./config:/config:ro
    ports:
      - "${CONTROLLER_PORT:-8181}:8181"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  switch-network:
    build:
      context: ./backend
      args:
        MODULE: switch-network
    environment:
      <<: *common-env
      NETWORK_PORT: 9191
      CONTROLLER_URL: http://sdn-controller:8181
      NETWORK_PUBLIC_URL: http://switch-network:9191
      # demo fabric by default; the system test needs ORION_TOPOLOGY=topology-triangle.yaml
      TOPOLOGY_FILE: /config/${ORION_TOPOLOGY:-topology.yaml}
    volumes:
      - ./config:/config:ro
    ports:
      - "${NETWORK_PORT:-9191}:9191"
    depends_on:
      - sdn-controller
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${UI_PORT:-3000}:80"
    depends_on:
      - sdn-controller
      - switch-network
    restart: unless-stopped

  # End-to-end check (only with --profile test):  docker compose --profile test run --rm system-test
  system-test:
    profiles: ["test"]
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /src
    volumes:
      - ./backend:/src
      - orion-m2:/root/.m2
    environment:
      CTRL: http://sdn-controller:8181
      NET: http://switch-network:9191
      NET_FROM_CONTROLLER: http://switch-network:9191
    command: ["mvn", "-B", "-ntp", "-q", "-pl", "system-test", "test", "-Dorion.systemTest=true", "-Dsurefire.printSummary=false"]

  # Convergence benchmark (only with --profile test):  docker compose --profile test run --rm benchmark
  benchmark:
    profiles: ["test"]
    image: maven:3.9.11-eclipse-temurin-21
    working_dir: /src
    volumes:
      - ./backend:/src
      - orion-m2:/root/.m2
    environment:
      CTRL: http://sdn-controller:8181
      NET: http://switch-network:9191
      TRIALS: ${TRIALS:-10}
    command: ["mvn", "-B", "-ntp", "-q", "-pl", "system-test", "test", "-Dorion.benchmark=true", "-Dtest=ConvergenceBenchmark", "-Dsurefire.printSummary=false"]

volumes:
  orion-db:
  orion-m2:
